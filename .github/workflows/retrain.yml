name: Scheduled Retraining

on:
  schedule:
    - cron: "0 0 * * 0"   # Every Sunday midnight UTC
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual retrain"
        required: false
        default: "manual trigger"
  workflow_call:
    inputs:
      reason:
        description: "Reason for triggered retrain (e.g., drift detected)"
        required: false
        type: string
        default: "drift-triggered"

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start MLflow server
        run: |
          mlflow server --host 127.0.0.1 --port 5000 &
          sleep 5
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000

      - name: Regenerate synthetic data (extended window)
        run: python data/generator/synthetic_demand.py

      - name: Generate features
        run: |
          python -c "
          import pandas as pd
          from features.feature_store import DemandFeatureStore
          demand = pd.read_csv('data/raw/demand_history.csv', parse_dates=['week'])
          meta = pd.read_csv('data/raw/sku_metadata.csv')
          store = DemandFeatureStore()
          features = store.generate_features(demand, meta)
          store.save(features, 'v1')
          "

      - name: Train candidate model
        id: train
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          python training/train.py --feature-version v1 --model quantile_lgbm 2>&1 | tee train.log
          # Extract run_id from log
          RUN_ID=$(grep "run_id=" train.log | tail -1 | grep -oP "run_id=\K[a-f0-9]+")
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Candidate run_id: $RUN_ID"

      - name: Run promotion gate
        id: promote
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          if [ -n "${{ steps.train.outputs.run_id }}" ]; then
            python training/promote_model.py \
              --run-id "${{ steps.train.outputs.run_id }}" \
              --metric wape \
              --threshold 0.02 && echo "promoted=true" >> $GITHUB_OUTPUT || echo "promoted=false" >> $GITHUB_OUTPUT
          else
            echo "No run_id captured — skipping promotion"
            echo "promoted=false" >> $GITHUB_OUTPUT
          fi

      - name: Post retraining summary
        uses: actions/github-script@v7
        with:
          script: |
            const promoted = "${{ steps.promote.outputs.promoted }}";
            const runId = "${{ steps.train.outputs.run_id }}";
            const reason = "${{ github.event.inputs.reason || 'scheduled' }}";
            const status = promoted === 'true' ? '✅ Promoted to Production' : '⏸️ Rejected (no improvement)';
            const body = `## Retraining Summary\n\n**Trigger:** ${reason}\n**Candidate run:** \`${runId}\`\n**Promotion result:** ${status}`;
            if (context.eventName === 'pull_request') {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } else {
              core.summary.addRaw(body).write();
            }
